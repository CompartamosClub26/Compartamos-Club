name: SQL security integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compartamos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compartamos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: compartamos_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase Auth shim
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/000_auth_test_setup.sql
      - name: Apply every migration in order
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run role, RLS and state-transition regression tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security_integration.sql
